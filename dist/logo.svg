<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient Definitions -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4500;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffaa00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff4500;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a101d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16243d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a101d;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff4500;stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:#ffaa00;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ff4500;stop-opacity:0" />
    </radialGradient>

    <!-- Filters for glow effects -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background glow -->
  <ellipse cx="60" cy="60" rx="45" ry="45" fill="url(#glowGradient)" opacity="0.3"/>

  <!-- Shield Icon -->
  <g transform="translate(20, 20)">
    <!-- Shield base -->
    <path d="M20 10 L50 10 L60 25 L60 70 L50 85 L20 85 L10 70 L10 25 Z"
          fill="url(#shieldGradient)"
          stroke="url(#logoGradient)"
          stroke-width="2"
          filter="url(#glow)"/>

    <!-- Shield inner highlight -->
    <path d="M25 20 L45 20 L52 30 L52 65 L45 75 L25 75 L18 65 L18 30 Z"
          fill="none"
          stroke="url(#logoGradient)"
          stroke-width="1"
          opacity="0.6"/>

    <!-- Security lock symbol -->
    <g transform="translate(35, 35)">
      <!-- Lock body -->
      <rect x="2" y="8" width="6" height="6" rx="1" fill="url(#logoGradient)"/>
      <!-- Lock shackle -->
      <path d="M1 8 Q1 4 5 4 Q9 4 9 8" fill="none" stroke="url(#logoGradient)" stroke-width="2"/>
      <!-- Lock keyhole -->
      <circle cx="5" cy="11" r="1" fill="url(#shieldGradient)"/>
      <rect x="4.5" y="9" width="1" height="4" fill="url(#shieldGradient)"/>
    </g>

    <!-- Corner accents -->
    <circle cx="15" cy="15" r="2" fill="url(#logoGradient)" opacity="0.8"/>
    <circle cx="55" cy="15" r="2" fill="url(#logoGradient)" opacity="0.8"/>
    <circle cx="15" cy="75" r="2" fill="url(#logoGradient)" opacity="0.8"/>
    <circle cx="55" cy="75" r="2" fill="url(#logoGradient)" opacity="0.8"/>
  </g>

  <!-- Text -->
  <g transform="translate(90, 0)">
    <!-- TRUE FORCE -->
    <text x="0" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="bold"
          fill="url(#logoGradient)" filter="url(#textGlow)">
      TRUE FORCE
    </text>

    <!-- SECURITY -->
    <text x="0" y="75" font-family="Arial, sans-serif" font-size="18" font-weight="600"
          fill="#f0f2f5" opacity="0.9">
      SECURITY
    </text>

    <!-- Tagline -->
    <text x="0" y="95" font-family="Arial, sans-serif" font-size="10" font-weight="400"
          fill="#a0aabf" letter-spacing="1px">
      ELITE GUARD SERVICES
    </text>
  </g>

  <!-- Decorative elements -->
  <g opacity="0.6">
    <!-- Top right accent -->
    <circle cx="380" cy="20" r="3" fill="url(#logoGradient)"/>
    <circle cx="375" cy="25" r="2" fill="url(#logoGradient)"/>
    <circle cx="385" cy="25" r="2" fill="url(#logoGradient)"/>

    <!-- Bottom left accent -->
    <circle cx="20" cy="100" r="2" fill="url(#logoGradient)"/>
    <circle cx="25" cy="105" r="1.5" fill="url(#logoGradient)"/>
    <circle cx="15" cy="105" r="1.5" fill="url(#logoGradient)"/>
  </g>
</svg>